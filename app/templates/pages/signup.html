{% extends "base.html" %}
{% block title %}Crear cuenta · Open Done{% endblock %}
{% block topbar %}{% endblock %}
{% block content %}
<div class="auth">
  <div class="auth-brand">Open Done</div>
  <h1 class="auth-title">Creá tu cuenta</h1>
  {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
  <form method="post" action="/signup" class="auth-form">
    <label class="field">
      <span class="field-label">Email</span>
      <input type="email" name="email" value="{{ email }}" required autofocus autocomplete="email">
    </label>
    <label class="field">
      <span class="field-label">Contraseña</span>
      <input type="password" name="password" required minlength="{{ MIN_PASSWORD_LENGTH }}"
        autocomplete="new-password">
      <span class="field-hint">Al menos {{ MIN_PASSWORD_LENGTH }} caracteres.</span>
    </label>
    <button type="submit" class="button-primary">Crear cuenta</button>
  </form>
  <p class="auth-alt">¿Ya tenés cuenta? <a href="/login">Entrá</a></p>
</div>
{% endblock %}
