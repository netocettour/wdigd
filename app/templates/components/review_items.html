<div id="review-items">
  <div class="ri-cols">
    {% for c in cols %}
    <div class="ri-col">
      <div class="ri-head">
        <div class="ri-label">{{ c.label }}</div>
        <div class="ri-prompt">{{ c.prompt }}</div>
      </div>
      {% for it in c["items"] %}
      <div class="ri-item">
        <div class="ri-line">
          <div class="ri-text">{{ it.text }}</div>
          {% if editable %}
          <button type="button" class="bullet-x ri-x" hx-delete="/review-items/{{ it.id }}?iso={{ iso }}" hx-target="#review-items" hx-swap="outerHTML" title="Eliminar">×</button>
          {% endif %}
        </div>
        {% if it.note %}<div class="ri-note">{{ it.note }}</div>{% endif %}
      </div>
      {% endfor %}
      {% if editable %}
      <form hx-post="/review-items" hx-target="#review-items" hx-swap="outerHTML"
        hx-on::after-request="if(event.detail.successful) this.reset()">
        <input type="hidden" name="iso_week" value="{{ iso }}">
        <input type="hidden" name="kind" value="{{ c.kind }}">
        <input class="add-input" name="text" placeholder="Agregar…" autocomplete="off">
        <button type="submit" hidden></button>
      </form>
      {% endif %}
    </div>
    {% endfor %}
  </div>
</div>
