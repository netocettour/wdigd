<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}wdigd{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&family=Work+Sans:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/main.css?v={{ asset_version('css/main.css') }}">
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
  <script src="/static/js/app.js?v={{ asset_version('js/app.js') }}" defer></script>
</head>
<body>
  {% block topbar %}
  <header class="topbar">
    <a class="topbar-brand" href="/today">wdigd</a>
    <nav class="topbar-nav">
      <a href="/today">Hoy</a>
      <a href="/week">Semana</a>
      <a href="/history">Historial</a>
      <a href="/settings">Ajustes</a>
      <form method="post" action="/logout" class="inline-form">
        <button type="submit" class="link-button">Salir</button>
      </form>
    </nav>
  </header>
  {% endblock %}
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
